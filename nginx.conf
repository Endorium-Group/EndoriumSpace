# Site EndoriumSpace servi par nginx derrière Caddy (TLS terminé par Caddy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives : nginx ne voit que http://<conteneur>:80, Caddy sert https.
    absolute_redirect off;
    server_tokens off;

    # Une seule URL par page : …/index.html → …/ (sur l'URI demandée, pas sur
    # la redirection interne de `index`, sinon boucle).
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # La démo interactive est publiée par GitHub Pages (elle se construit avec
    # les sources Enterprise, absentes de cette image).
    location = /demo { return 302 https://endorium-group.github.io/EndoriumSpace/demo/; }
    location ^~ /demo/ { return 302 https://endorium-group.github.io/EndoriumSpace$request_uri; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
