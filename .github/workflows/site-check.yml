# Vérifie que les pages statiques (docs, questions, sitemap) sont régénérées
# après une modification de docs/content, docs/nav.js ou community/data.
name: Site check

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages générées à jour
        run: node scripts/build.mjs --check
