<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Question — Communauté EndoriumFort</title>
  <link rel="canonical" href="https://endorium.space/community/" />
  <link rel="icon" type="image/png" href="../assets/logo-mark.png" />
  <link rel="stylesheet" href="../assets/app.css" />
  <script src="data/questions.js"></script>
  <script>
    // Anciennes adresses question.html?id=N / ?slug=… → page statique de la question.
    (function () {
      var p = new URLSearchParams(location.search), id = parseInt(p.get("id"), 10), slug = p.get("slug");
      var q = (window.EFQA || []).filter(function (x) { return (id && x.id === id) || (slug && x.slug === slug); })[0];
      location.replace(q ? q.slug + "/" : "./");
    })();
  </script>
</head>
<body>
  <main class="qd"><p class="back"><a href="./">← Communauté</a></p></main>
</body>
</html>
