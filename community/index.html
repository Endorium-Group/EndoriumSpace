<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Communauté — EndoriumFort</title>
  <meta name="description" content="Questions &amp; réponses de la communauté EndoriumFort : installation, sécurité, exploitation." />
  <link rel="icon" type="image/png" href="../assets/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/app.css" />
  <script>(function(){try{var t=localStorage.getItem("ef-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
  <header class="hdr">
    <div class="hdr-in">
      <a class="brand" href="../index.html"><img src="../assets/logo-mark.png" alt="" /><span>Endorium<b>Fort</b></span></a>
      <nav>
        <a href="../index.html">Site</a>
        <a href="../docs/">Docs</a>
        <a href="./" class="active">Communauté</a>
      </nav>
      <span class="spacer"></span>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="search" type="search" placeholder="Rechercher une question…" autocomplete="off" aria-label="Rechercher" />
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Thème"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </header>

  <main class="community">
    <div class="q-head">
      <h1>Questions de la communauté</h1>
      <a class="btn btn--primary" href="[lien-poser-question]">Poser une question</a>
    </div>
    <div class="callout">Espace de questions-réponses <strong>curé</strong> (en lecture). Pour proposer une question ou une réponse, contribuez via le dépôt du projet. <a href="../docs/">Consultez aussi la documentation</a>.</div>
    <div class="tagbar" id="tagbar"></div>
    <div class="qlist" id="qlist"></div>
  </main>

  <script src="../assets/md.js"></script>
  <script src="data/questions.js"></script>
  <script>
  (function () {
    "use strict";
    var Q = (window.EFQA || []).slice();
    var qlist = document.getElementById("qlist");
    var tagbar = document.getElementById("tagbar");
    var search = document.getElementById("search");
    var activeTag = null;

    // Tags uniques
    var tags = {};
    Q.forEach(function (q) { (q.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; }); });
    Object.keys(tags).sort().forEach(function (t) {
      var a = document.createElement("button");
      a.className = "tag"; a.textContent = t + " (" + tags[t] + ")"; a.dataset.tag = t;
      a.addEventListener("click", function () {
        activeTag = activeTag === t ? null : t;
        tagbar.querySelectorAll(".tag").forEach(function (x) { x.classList.toggle("active", x.dataset.tag === activeTag); });
        render();
      });
      tagbar.appendChild(a);
    });

    function excerpt(md) { return EFMD.strip(md).slice(0, 160) + "…"; }

    function render() {
      var q = search.value.trim().toLowerCase();
      var rows = Q.filter(function (item) {
        if (activeTag && (item.tags || []).indexOf(activeTag) < 0) return false;
        if (q.length >= 2) {
          var hay = (item.title + " " + EFMD.strip(item.body) + " " + (item.tags || []).join(" ")).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      }).sort(function (a, b) { return b.votes - a.votes; });

      if (!rows.length) { qlist.innerHTML = '<div style="padding:28px;color:var(--muted)">Aucune question ne correspond.</div>'; return; }

      qlist.innerHTML = rows.map(function (item) {
        var answers = item.answers || [];
        var accepted = answers.some(function (a) { return a.accepted; });
        var tagsHtml = (item.tags || []).map(function (t) { return '<span class="tag">' + t + "</span>"; }).join(" ");
        return '' +
          '<div class="qrow">' +
            '<div class="qstats">' +
              '<div><span class="n">' + item.votes + "</span><br>votes</div>" +
              '<div class="' + (accepted ? "accepted" : "") + '"><span class="n">' + answers.length + "</span><br>rép.</div>" +
              '<div>' + (item.views || 0) + " vues</div>" +
            "</div>" +
            "<div>" +
              '<h3><a href="question.html?id=' + item.id + '">' + item.title + "</a></h3>" +
              '<p class="excerpt">' + excerpt(item.body) + "</p>" +
              '<div class="meta">' + tagsHtml + '<span class="who">par ' + item.author + " · " + item.date + "</span></div>" +
            "</div>" +
          "</div>";
      }).join("");
    }

    search.addEventListener("input", render);
    render();

    document.getElementById("themeToggle").addEventListener("click", function () {
      var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", n);
      try { localStorage.setItem("ef-theme", n); } catch (e) {}
    });
  })();
  </script>
</body>
</html>
