<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informations légales — EndoriumFort</title>
  <meta name="robots" content="index,follow" />
  <link rel="icon" type="image/png" href="../assets/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/app.css" />
  <script>(function(){try{var t=localStorage.getItem("ef-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
  <header class="hdr">
    <div class="hdr-in">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Sommaire"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <a class="brand" href="../index.html"><img src="../assets/logo-mark.png" alt="" /><span>Endorium<b>Fort</b></span></a>
      <nav>
        <a href="../index.html">Site</a>
        <a href="../docs/">Docs</a>
        <a href="../community/">Communauté</a>
        <a href="./" class="active">Légal</a>
      </nav>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeToggle" aria-label="Thème"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h4>Informations légales</h4>
    </aside>
    <main class="content">
      <article class="content-inner md" id="content">Chargement…</article>
    </main>
  </div>

  <script src="../assets/md.js"></script>
  <script>
  (function () {
    "use strict";
    var PAGES = [
      { slug: "mentions-legales", title: "Mentions légales", file: "mentions-legales.md" },
      { slug: "confidentialite", title: "Politique de confidentialité", file: "confidentialite.md" },
      { slug: "cookies", title: "Gestion des cookies", file: "cookies.md" },
      { slug: "cgu", title: "Conditions d'utilisation", file: "cgu.md" }
    ];
    var byslug = {}; PAGES.forEach(function (p) { byslug[p.slug] = p; });
    var first = PAGES[0].slug;
    var sb = document.getElementById("sidebar");
    PAGES.forEach(function (p) {
      var a = document.createElement("a"); a.href = "#/" + p.slug; a.textContent = p.title; a.dataset.slug = p.slug; sb.appendChild(a);
    });
    var content = document.getElementById("content");
    var cache = {};
    function load(slug) {
      var p = byslug[slug] || byslug[first];
      sb.querySelectorAll("a").forEach(function (a) { a.classList.toggle("active", a.dataset.slug === p.slug); });
      sb.classList.remove("open");
      if (cache[p.slug]) return paint(p, cache[p.slug]);
      fetch("content/" + p.file).then(function (r) { return r.ok ? r.text() : "# " + p.title + "\n\n*Page en cours de rédaction.*"; })
        .then(function (md) { cache[p.slug] = md; paint(p, md); })
        .catch(function () { content.innerHTML = "<p>Impossible de charger la page.</p>"; });
    }
    function paint(p, md) { content.innerHTML = EFMD.render(md); EFMD.addCopyButtons(content); document.title = p.title + " — EndoriumFort"; window.scrollTo(0, 0); }
    window.addEventListener("hashchange", function () { load(location.hash.replace(/^#\//, "") || first); });
    load(location.hash.replace(/^#\//, "") || first);
    document.getElementById("themeToggle").addEventListener("click", function () {
      var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("ef-theme", n); } catch (e) {}
    });
    document.getElementById("menuBtn").addEventListener("click", function () { sb.classList.toggle("open"); });
  })();
  </script>
</body>
</html>
